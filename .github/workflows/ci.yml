name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.14"
      - run: python3.14 -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/ruff check .
      - run: .venv/bin/pytest
      - run: .venv/bin/pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
      - run: cd backend && python3.14 -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: cd frontend && npm ci
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - run: cd e2e && npx playwright test --pass-with-no-tests

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - run: docker compose build
